[workspace]
resolver = "3"
members = [
    "crates/keystone-sync",
    "crates/keystone-secrets",
    "crates/keystone-realtime",
    "crates/wire-codegen",
    "src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
# rustls only (no native-tls); the ring provider is installed by the client.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
zeroize = "1"
tempfile = "3"
wiremock = "0.6"
