[package]
name = "keystone-sync"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reqwest.workspace = true
# `functions`: typed list keys and conditions (`store::listing`).
rusqlite = { workspace = true, features = ["functions"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
uuid.workspace = true
zeroize.workspace = true

[features]
# Raw store, outbox and conflict access (`store::raw`) for this crate's own
# integration tests. The shell never enables it.
raw-store = []

[dev-dependencies]
# Turns `raw-store` on for the integration tests only.
keystone-sync = { path = ".", features = ["raw-store"] }
jsonschema = { version = "0.60", default-features = false }
tempfile.workspace = true
# net, io-util: the scripted raw HTTP server of the cut-connection tests.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
wiremock.workspace = true
