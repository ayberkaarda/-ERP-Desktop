[package]
name = "keystone-secrets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
keystone-sync = { path = "../keystone-sync" }
# keyring v4 ecosystem: the core API (with its in-memory `mock` store) plus
# one native store per platform, as the keyring v4 docs advise for apps.
keyring-core = "1"
getrandom = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
