[package]
name = "keystone-realtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
log = "0.4"
rustls.workspace = true
# Same verifier as the reqwest client of keystone-sync (OS trust store).
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
# rustls only, no native-tls: the connector is built here with the ring provider.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
url = "2"
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
