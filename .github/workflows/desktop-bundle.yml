name: Desktop Bundle
# Unsigned installers as workflow artifacts only: no release, no tag creation,
# no updater, no signing secrets (portfolio project).
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  web-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_DATABASE: keystone_test
      DB_USERNAME: keystone
      DB_PASSWORD: keystone
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: keystone_test
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: keystone
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U keystone -d keystone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - run: npm ci
      # The web app type-checks against the generated API types (same steps as desktop-rust.yml).
      - name: Generate the web API types
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          composer openapi
      - run: npm run gen:api --workspace frontend
      - run: npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-dist
          path: desktop/dist
          retention-days: 1
          if-no-files-found: error
  bundle:
    name: bundle (${{ matrix.os }})
    needs: web-bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Tauri system packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install toolchain from rust-toolchain.toml
        working-directory: desktop
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          key: bundle-${{ matrix.os }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-dist
          path: desktop/dist
      - name: Skip the web build (the bundle was built above)
        shell: bash
        run: echo '{"build":{"beforeBuildCommand":""}}' > desktop/ci-no-before-build.json
      - name: Build unsigned installers
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: desktop
          # No tagName/releaseId: the action publishes nothing. The web bundle comes from web-bundle.
          args: --config ci-no-before-build.json
      - name: Release binary must not contain the debug-only WebDriver hook
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if grep -a -q WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS desktop/target/release/keystone-desktop.exe; then
            echo 'debug-only WebDriver hook found in the release binary'
            exit 1
          fi
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p installers
          find desktop/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec cp {} installers/ \; 2>/dev/null || true
          ls -l installers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keystone-desktop-unsigned-${{ matrix.os }}
          path: installers/*
          if-no-files-found: error
          retention-days: 14
