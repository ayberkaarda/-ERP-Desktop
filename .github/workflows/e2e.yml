name: E2E
on:
  push:
  pull_request:
jobs:
  e2e:
    if: ${{ hashFiles('frontend/e2e/**') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: E2E placeholder
        run: echo "Configure the frontend E2E command when frontend/e2e is added."
