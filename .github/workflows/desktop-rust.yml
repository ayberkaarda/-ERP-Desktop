name: Desktop Rust
on:
  push:
    paths:
      - 'desktop/**'
      - 'contracts/sync/**'
      - 'contracts/offline-manifest.json'
      - '.github/workflows/desktop-rust.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'contracts/sync/**'
      - 'contracts/offline-manifest.json'
      - '.github/workflows/desktop-rust.yml'
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Wire code matches contracts/sync
        run: sh scripts/gen-wire.sh
      - run: cargo deny check
      - run: cargo audit
