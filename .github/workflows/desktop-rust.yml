name: Desktop Rust
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      # The webview bundles the web app (frontend/src) and its API types.
      - 'frontend/**'
      - 'contracts/sync/**'
      - 'contracts/offline-manifest.json'
      # Read by the wire tests (schema of the manifest, Node fixture table, resolution table).
      - 'contracts/offline-manifest.schema.json'
      - 'contracts/scripts/validate.mjs'
      - 'docs/SYNC-PROTOCOL.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-rust.yml'
  pull_request:
    paths:
      - 'desktop/**'
      # The webview bundles the web app (frontend/src) and its API types.
      - 'frontend/**'
      - 'contracts/sync/**'
      - 'contracts/offline-manifest.json'
      # Read by the wire tests (schema of the manifest, Node fixture table, resolution table).
      - 'contracts/offline-manifest.schema.json'
      - 'contracts/scripts/validate.mjs'
      - 'docs/SYNC-PROTOCOL.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-rust.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo fmt --all -- --check
      # The Tauri shell needs the webkit system packages; the desktop-shell job covers it.
      - run: cargo clippy --workspace --exclude keystone-desktop --all-targets --locked -- -D warnings
      # The crate as the shell links it: no dev-dependency features unified in.
      - run: cargo clippy -p keystone-sync --lib --locked -- -D warnings
      - name: Shell does not enable keystone-sync raw-store
        run: |
          tree=$(cargo tree -p keystone-desktop -e features -i keystone-sync --target all --locked)
          printf '%s\n' "$tree"
          if printf '%s\n' "$tree" | grep -q 'raw-store'; then
            echo "::error::keystone-desktop enables the raw-store feature of keystone-sync"
            exit 1
          fi
      - run: cargo test --workspace --exclude keystone-desktop --locked
      # The plain-ws refusal is a release-only gate (debug_assertions off).
      - run: cargo test --release -p keystone-realtime --lib --locked
      - name: Wire code matches contracts/sync
        run: sh scripts/gen-wire.sh
      - run: cargo deny check
      # RUSTSEC-2026-0459: see desktop/deny.toml (bundled SQLCipher has no patched release).
      - run: cargo audit --ignore RUSTSEC-2026-0459
  desktop-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    env:
      CARGO_TERM_COLOR: always
      # The backend database the OpenAPI export reads (same as frontend.yml).
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_DATABASE: keystone_test
      DB_USERNAME: keystone
      DB_PASSWORD: keystone
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: keystone_test
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: keystone
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U keystone -d keystone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          key: shell
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - run: npm ci
        working-directory: .
      # The desktop bundle type-checks the web app, which needs the generated
      # frontend/src/lib/api/schema.d.ts (gitignored; same steps as frontend.yml).
      - name: Generate the web API types
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          composer openapi
      - run: npm run gen:api --workspace frontend
        working-directory: .
      - run: npm run lint
      - run: npm run typecheck
      # Includes the module swap and the in-memory bundle trace tests (tooling/).
      - run: npm run test
      - run: npm run i18n:check
      - name: Wire TypeScript matches contracts/
        run: sh scripts/check-wire-ts.sh
      - run: npm run build
      # The other operating systems reuse this bundle: they have no Postgres/PHP to generate the API types.
      - name: Upload the built web bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-dist
          path: desktop/dist
          retention-days: 1
          if-no-files-found: error
      - name: The built bundle carries no web transport
        run: |
          # axios (CSRF round trip), laravel-echo (auth endpoint, wsHost), pusher-js.
          if grep -rlE 'sanctum/csrf-cookie|X-XSRF-TOKEN|broadcasting/auth|wsHost|pusher|Pusher' dist; then
            echo "::error::the desktop bundle carries the web transport (axios/Echo/pusher)"
            exit 1
          fi
      - run: cargo clippy -p keystone-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p keystone-desktop --locked
      - name: TypeScript types match the Rust DTOs
        run: sh scripts/check-ts-types.sh
      # build.rs runs its release guard on the shipped config (no bundling).
      - run: cargo check --release -p keystone-desktop --locked
      - name: Release build refuses an open connect-src
        # The build script panics on a refused policy: cargo exits with 101.
        run: |
          set +e
          TAURI_CONFIG='{"app":{"security":{"csp":"connect-src ipc: http://ipc.localhost https:"}}}' \
            cargo check --release -p keystone-desktop --locked 2> refused.log
          status=$?
          set -e
          if [ "$status" -ne 101 ]; then
            cat refused.log
            echo "::error::expected the refused release build to exit 101, got $status"
            exit 1
          fi
          grep -F 'release build refused: connect-src allows https:' refused.log
  secrets-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          key: secrets-macos
      # Compiles the apple-native-keyring-store (Keychain) path of keystone-secrets.
      - run: cargo check -p keystone-secrets --all-targets --locked
  # Windows and macOS counterparts of `rust` and `desktop-shell` (those two stay
  # Linux-only so their required check names do not change). New check names:
  # `rust-os (windows-latest)`, `rust-os (macos-latest)`, `shell-os (...)`.
  rust-os:
    name: rust-os (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          key: os-${{ matrix.os }}
      - run: cargo clippy --workspace --exclude keystone-desktop --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude keystone-desktop --locked
      - run: cargo test --release -p keystone-realtime --lib --locked
  shell-os:
    name: shell-os (${{ matrix.os }})
    needs: desktop-shell
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          key: shell-${{ matrix.os }}
      - name: Download the web bundle built on Linux
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-dist
          path: desktop/dist
      - run: cargo clippy -p keystone-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p keystone-desktop --locked
      - run: cargo check --release -p keystone-desktop --locked
