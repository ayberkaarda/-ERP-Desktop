name: Backend
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB_PORT: 5433
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: keystone
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: keystone
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U keystone -d keystone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Cache electronic document validation runtime
        uses: actions/cache@v4
        with:
          path: backend/storage/app/edocuments/runtime
          key: edoc-validation-${{ hashFiles('backend/app/Modules/EDocuments/Resources/runtime-manifest.json') }}
      - name: Install electronic document validation runtime
        working-directory: backend
        run: php scripts/install-edocument-runtime.php
      - name: Create test database
        env:
          PGPASSWORD: keystone
        run: createdb -h 127.0.0.1 -p 5433 -U keystone keystone_test
      - name: Pint
        working-directory: backend
        run: composer lint
      - name: PHPStan
        working-directory: backend
        run: composer analyse
      - name: Check offline manifest routes
        working-directory: backend
        run: php scripts/check-offline-manifest.php
      - name: Pest
        working-directory: backend
        timeout-minutes: 45
        run: bash scripts/ci-pest.sh
      - name: Upload Pest diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pest-diagnostics
          path: ${{ runner.temp }}/pest-diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - name: Process list on failure or cancel
        if: ${{ failure() || cancelled() }}
        run: |
          ps -eo pid,ppid,stat,etimes,pcpu,args --forest | cut -c1-250
          PGPASSWORD=keystone psql -h 127.0.0.1 -p 5433 -U keystone -d keystone_test -c "select pid, state, wait_event, now()-query_start as age, left(query,200) from pg_stat_activity where datname='keystone_test'" || true
