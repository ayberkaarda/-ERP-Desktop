name: Backend
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: keystone_test
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: keystone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keystone -d keystone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Pint
        working-directory: backend
        run: composer lint
      - name: PHPStan
        working-directory: backend
        run: composer analyse
      - name: Pest
        working-directory: backend
        run: composer test
